name: BT Karaoke Studio - Windows
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Build, test VST3 hosting and verify installer
        shell: pwsh
        run: |
          try {
            ./packaging/windows.ps1 *>&1 | Tee-Object windows-output.txt
          } catch {
            $diagnostics = ($_ | Out-String) + (Get-Content windows-output.txt -Tail 50 | Out-String)
            if (Test-Path build/Testing/Temporary/LastTest.log) {
              $diagnostics = $diagnostics + (Get-Content build/Testing/Temporary/LastTest.log -Tail 90 | Out-String)
            }
            if ($diagnostics.Length -gt 22000) { $diagnostics = $diagnostics.Substring($diagnostics.Length - 22000) }
            $diagnostics = $diagnostics.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=BT Studio Windows diagnostics::$diagnostics"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: BT-Karaoke-Studio-0.1.0-Windows-x64
          path: installer-output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BT-Studio-test-results
          path: |
            build/Testing/Temporary/LastTest.log
            windows-output.txt
          if-no-files-found: ignore
